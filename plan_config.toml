# The plan's wording: how labels are written and how the scale is read.
#
# Nothing here is a colour, a CAD layer or a size of this plan's elements. What stays configurable
# is the label grammar, which is a drafting convention (French / Moroccan here), and the scale fit.
# Change this file for an office that writes its labels differently.

[calibration]
# a dimension line is len = scale * value - gap; samples farther than this from the fit are ignored
tolerance = 0.02                # in the dimension text's own unit (metres on this plan)
min_value_spread = 1.0          # only pairs of dimensions differing by more than this feed the slope
min_inlier_share = 0.6          # below this the scale is considered unreliable and the run stops
min_samples = 10

[text]
# strokes shorter than this share of the typical text height are glyphs
glyph_share_of_text_height = 0.66

# ---------------------------------------------------------------------------
# Labels naming one element. Named groups: type, bld (building), and for sized labels a, b, h.
# `key` builds the type identifier; `sized_key` is used when a/b/h are present.
# `per_building = true`: the same type can have a different size in each building.
# `size_match` = "both" (default) or "width": which sizes must agree for an unlabelled element
# to take the type.
# ---------------------------------------------------------------------------
[labels.column]                 # poteau
pattern = '^P(?P<type>\d+[a-z]?)\s*/\s*(?P<bld>\d{3})'
key = "P{type}/{bld}"
per_building = true

[labels.wall]                   # voile
pattern = '^V(?P<type>\d+[a-z]?)\s*/\s*(?P<bld>\d{3})'
key = "V{type}/{bld}"
per_building = true

[labels.retaining_wall]         # voile périphérique; VP20 = 20 cm thick
pattern = '^VP(?P<type>\d+)'
key = "VP{type}"
per_building = false
size_match = "width"

[labels.footing]                # semelle isolée (S) / combinée (SC)
pattern = '^(?P<series>SC|S)(?P<type>\d+)\s*-?\s*(?P<bld>\d{3})?(?:.*?\((?P<a>\d+)x(?P<b>\d+)x(?P<h>\d+)\))?'
key = "{series}{type}"
sized_key = "{series}{type}({a}x{b}x{h})"
size_unit_m = 0.01              # a, b, h are written in cm
per_building = false

[labels.footing.series_subclass]
S = "isolated_footing"
SC = "combined_footing"

# Labels naming a region rather than one drawn shape.
# The raft stamp: a word in a circle, the thickness (cm) written with it or as the number under it.
[region_labels.raft]            # radier
pattern = '(?i)^radier'
exclude = '(?i)relevage'
thickness = '(\d{2,3})\s*CM'
number = '\d{2,3}'
key = "Radier"

[region_labels.pit]             # fosse de relevage (sump pit)
pattern = '(?i)fosse\s+de\s+relevage'
key = "Fosse"

# ---------------------------------------------------------------------------
# Elements drawn as a pair of parallel lines; the label states the section (width x height, cm).
# ---------------------------------------------------------------------------
[bands.grade_beam]              # longrine
label = '^LG[\s\-]*(?P<a>\d+)\s*[xX]\s*(?P<b>\d+)'
key = "LG{a}x{b}"

[bands.strip_footing]           # semelle filante
label = 'SF(?P<type>\d+)\D*?(?P<a>\d+)\s*[xX]\s*(?P<b>\d+)'
key = "SF{type}"
